<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} — Четверть</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <a class="brand" href="{{ url_for('home') }}">
      <!-- Логотип: четверть циферблата = 15 минут -->
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="11.5" fill="none" stroke="#fff" stroke-width="2"/>
        <path d="M13 13 V3 A10 10 0 0 1 23 13 Z" fill="#f0c419"/>
      </svg>
      Четверть
    </a>
    <!-- Меню строится из списка сущностей: новая сущность появится здесь сама -->
    <nav class="nav">
      {% for e in entities %}
        <a href="{{ url_for(e.name ~ '.index') }}"
           {% if request.blueprint == e.name %}class="active"{% endif %}>{{ e.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
